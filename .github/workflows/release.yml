name: Build installers

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run package:mac
      - uses: actions/upload-artifact@v4
        with:
          name: switch-kpi-macos
          path: release/Switch KPI-*-arm64.dmg

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build dashboard
        shell: pwsh
        run: |
          $env:WRANGLER_LOG_PATH = ".wrangler/wrangler.log"
          npx vinext build
      - run: npx electron-builder --win zip --x64
      - uses: actions/upload-artifact@v4
        with:
          name: switch-kpi-windows
          path: release/Switch KPI-*-win.zip

  release:
    needs:
      - macos
      - windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.2
          target_commitish: main
          name: Switch KPI 0.1.2
          generate_release_notes: true
          files: installers/*

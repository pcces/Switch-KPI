name: Build installers

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run package:mac
      - uses: softprops/action-gh-release@v2
        with:
          files: release/Switch KPI-*-arm64.dmg

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build dashboard
        shell: pwsh
        run: |
          $env:WRANGLER_LOG_PATH = ".wrangler/wrangler.log"
          npx vinext build
      - run: npx electron-builder --win zip --x64
      - uses: softprops/action-gh-release@v2
        with:
          files: release/Switch KPI-*-win.zip
